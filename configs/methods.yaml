# Методы кластеризации (src/pulsar/methods.py). Одни и те же X_t, A_t подаются во все методы,
# чтобы различия в разбиениях объяснялись методом, а не данными.
seed: 42                    # общее зерно: воспроизводимость всех стохастических шагов (k-means++, Leiden, KEFRiN)
k_fixed: 6                  # рабочее K для основных таблиц/карт (уточняется по консенсусу индексов)
k_grid: [4, 5, 6, 7, 8, 9, 10]   # сетка K для выбора по ICVI и бутстрэп-устойчивости

methods: [kmeans, ward, spectral, leiden, kefrin, kefrin_balanced]   # порядок = порядок в отчёте: признаки → сеть → оба

params:
  kmeans:
    n_init: 10              # 10 стартов k-means++: уходим от плохого локального минимума
  ward: {}                  # детерминирован, параметров нет
  spectral:
    eps: 1.0e-6             # ε-связность для несвязных графов (иначе спектральное вложение вырождено)
  leiden:
    min_size: 5             # сообщество < 5 МО считаем «мелким»: присоединяем, не учитываем в счёте K
    gamma_lo: 0.01          # границы бисекции по разрешению γ (log-шкала)
    gamma_hi: 10.0
    max_iter: 25            # ≤ 25 запусков Leiden на подбор γ
    n_iterations: -1        # Leiden до сходимости (стабильнее счёт сообществ при бисекции)
  kefrin:
    rho: 1.0                # вес признаков в F = ρ‖Y−SC‖² + ξ‖P−SΛ‖² (как в статье: ρ = ξ = 1)
    xi: 1.0                 # вес сети; сетка по ρ/ξ — анализ чувствительности
    n_init: 5               # 5 стартов K-Means++, лучший по F
    max_iter: 100           # предел чередований назначение/центры
    metric: euclidean       # euclidean (KEFRiNe) или cosine (KEFRiNc)
    init: kmeans++          # kmeans++ (вероятностный) или maxmin (детерминированный, как в статье)
  kefrin_balanced:          # тот же KEFRiN, но ξ умножен на ‖Y‖²/‖P‖²: сеть и признаки вносят равный вклад в F
    rho: 1.0
    xi: 1.0                 # базовый ξ до масштабирования (эффективный ξ ≈ 40–45 на наших данных)
    n_init: 5
    max_iter: 100
    metric: euclidean
    init: kmeans++

temporal_leiden:
  interslice_weight: 0.25   # ω по Mucha 2010: связь узла с собой между соседними месяцами; при ω=0.5 и min_size=5 бисекция по γ
                            # давала вырожденное решение (одно сообщество на 90 % узлов + осколки), см. отчёт §3.3
  min_size: 20              # «крупное» сообщество ≥ 1 % МО: отсекает осколки при подборе γ
  k_grid: [4, 6, 8]         # 24 среза × 2016 узлов: ~8–9 мин на K, поэтому сетка реже, чем у помесячных методов
  gamma_lo: 0.02            # границы бисекции по γ (24 среза × 2016 узлов — каждый запуск дорог, поэтому диапазон уже, чем у leiden)
  gamma_hi: 3.0
  max_iter: 12              # ≤ 12 запусков на подбор γ
  n_iterations: 2           # 2 итерации Leiden на запуск: при 24 срезах «до сходимости» (-1) в 5–10 раз дольше, разница в Q < 1 %

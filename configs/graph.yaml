# Гиперпараметры графов близости МО (src/pulsar/graphs.py). Единственный источник правды.
# Граф месяца t строится только по данным ≤ t (без утечки будущего).

behaviour:            # слой «поведение»: признаки месяца (CLR долей + лог-уровень)
  k: 10               # соседей на вершину; 10–15 — компромисс «разреженность vs связность» (Zelnik-Manor & Perona)
  mutual: true        # взаимный kNN: ребро только если i∈kNN(j) и j∈kNN(i) — режет «хабы» в плотных зонах
  local_scale_k: 7    # σ_i = расстояние до 7-го соседа (значение из оригинальной статьи, 2004)
  add_mst: true       # рёбра MST дают связность и отсутствие изолятов для спектральных методов

comovement:           # слой «со-движение»: корреляции лог-приростов итоговых трат
  window: 12          # прошлых месяцев; 12 покрывает один сезонный цикл, при этом есть ≥ 12 срезов для динамики
  min_window: 3       # меньше 3 точек корреляция бессмысленна — слой пустой, SNF его пропускает
  k: 10               # k сильнейших корреляций на вершину
  lags: [0, 1]        # ±1 месяц: «один регион опережает другой» (формулировка жюри), больше — шум на 12 точках
  shrinkage: ledoit_wolf   # N ≫ W: выборочная ковариация вырождена; усадка LW делает оценку состоятельной. none — для абляции
  mutual: true

gravity:              # слой «география»: дорожные расстояния между центрами МО
  k: 10               # ближайших по дороге
  scale_km: 200.0     # w = exp(−D/200): типичный радиус «регионального рынка» (~2–3 часа пути)
  zero_distance_km: 5.0    # «город и одноимённый район» с нулевым расстоянием → 5 км, чтобы вес не был ровно 1
  mutual: false       # география не должна рвать граф: объединение kNN, симметризация по max

fusion:               # слияние слоёв
  method: snf         # Similarity Network Fusion (Wang et al. 2014); mean — усреднение для абляции
  k: 10               # размер окрестности в локальном ядре S и в финальном разрежении
  t: 10               # итераций диффузии; обычно сходится за 10–20
  alpha: 0.5          # вес самопетли при нормировке P (P_ii = 1/2 как в статье); регуляризует диффузию
  mutual: true        # финальное разрежение взаимное: SNF двух одинаковых слоёв ≈ сам слой (Жаккар > 0.6)
  add_mst: true       # максимальное остовное дерево слитой матрицы — связность для спектральных методов

primary: fused        # основной слой для методов и ICVI; остальные — абляция

# Интерпретация типов (src/pulsar/interpret.py). Внешние переменные (Росстат, тип/статус МО, доступность рынков)
# в кластеризацию НЕ входили — используются только для проверки «снаружи».
seed: 42

mirkin:
  top_n: 3                  # сколько признаков с наибольшим вкладом n_k c_kv² показывать в подписи типа

rule_tree:
  max_depth: 3              # глубина 3 → ≤ 8 листьев: правила читаются экономистом, а не только машиной
  min_leaf: 30              # лист ≥ 30 МО: правило описывает группу, а не единичные случаи
  cv_folds: 5               # точность по 5-fold CV — честнее точности на обучении

typical:
  n: 3                      # 3 типичных (ближе всех к центру) и 3 пограничных МО на тип

external:
  meta_categorical: [municipal_district_type, region_name, municipal_district_status]   # категориальные из справочника
  min_category_size: 5      # редкие категории (< 5 МО) объединяются в «прочее» перед V Крамера/NMI

# Автоматические черновые имена типов. Условия — на средние стандартизованных признаков (в единицах СКО).
# Правила проверяются по порядку, первое подходящее выигрывает. Финальные имена подтверждает человек;
# check_names() проверяет, что заявленное имя согласуется с профилем (условия того же правила).
naming:
  thresholds:               # единые пороги, на которые ссылаются правила ниже
    very_high: 0.8
    high: 0.4
    low: -0.4
    very_low: -0.8
  rules:
    - name: "Северные и ресурсные территории"
      short: "Север и ресурсы"
      when: {log_level_rel: {min: high}, "clr_Прочее": {min: high}, "clr_Маркетплейсы": {max: low}}
      description: "Высокий уровень трат при большой доле «прочих» категорий и слабом онлайн-канале: северные и добывающие территории с дорогой логистикой."
    - name: "Крупные города и столичные центры"
      short: "Города"
      when: {log_level_rel: {min: very_high}, "clr_Общественное питание": {min: high}}
      description: "Высокий уровень трат на жителя и заметная доля общественного питания: региональные столицы и крупные города с развитой сферой услуг."
    - name: "Пригороды и транспортные коридоры"
      short: "Пригороды"
      when: {"clr_Транспорт": {min: very_high}}
      description: "Повышенная доля транспорта: пригородные районы и МО на магистралях, где значимая часть трат — топливо и переезды."
    - name: "Сельская периферия: продовольственная корзина"
      short: "Село: продовольствие"
      when: {"clr_Продовольствие": {min: high}, log_level_rel: {max: low}}
      description: "Низкий уровень трат, в структуре доминирует продовольствие: сельская периферия с минимальным набором услуг."
    - name: "Сельская периферия: онлайн-доступ"
      short: "Село: онлайн"
      when: {"clr_Маркетплейсы": {min: high}, log_level_rel: {max: low}}
      description: "Низкий уровень трат, но высокая доля маркетплейсов: периферия, где онлайн-канал заменяет отсутствующую офлайн-торговлю."
    - name: "Районы с акцентом на здоровье"
      short: "Здоровье"
      when: {"clr_Здоровье": {min: very_high}}
      description: "Повышенная доля трат на здоровье (аптеки, медицина): МО со старшим населением или медицинскими центрами притяжения."
    - name: "Средние города и райцентры"
      short: "Райцентры"
      when: {log_level_rel: {min: -0.4, max: 0.8}}
      description: "Уровень трат около среднего по стране и сбалансированная структура: малые и средние города, районные центры."
  fallback_name: "Тип {k}: {features}"   # если ни одно правило не подошло — имя по топ-признакам Миркина
  feature_labels:                         # русские подписи признаков для имён и описаний
    clr_Продовольствие: "продовольствие"
    clr_Здоровье: "здоровье"
    clr_Маркетплейсы: "маркетплейсы"
    "clr_Общественное питание": "общепит"
    clr_Транспорт: "транспорт"
    clr_Прочее: "прочее"
    log_level_rel: "уровень трат"

readable:                   # подписи для «паспорта типа» и дерева правил в исходных единицах
  share_suffix: ", %"
  level_name: "Итог на жителя"
  level_unit: "₽"

# Внешние данные Росстата: БДМО через каталог «Если быть точным» (https://tochno.st/datasets/bdmo).
# Архивы скачивает `make data` (см. configs/data.yaml → rosstat_bdmo). Читаем прямо из zip, не распаковывая.
year: 2023                 # основной год: совпадает с началом панели СберИндекса (2023-01…2024-12)
fallback_years: [2024]     # запасной срез — если есть в архивах, пишем рядом
dir: data/external/rosstat
out_dir: outputs/external
files:
  population: data_Y48112027_112_v20260928.zip   # численность населения на 1 января (атрибут mest)
  employees:  data_Y48423005_112_v20260928.zip   # среднесписочная численность работников организаций без МСП (атрибут okved2)
  wages:      data_Y48423007_112_v20260928.zip   # среднемесячная зарплата работников организаций без МСП (атрибут okved2)
members:                   # имена членов архива; {code} — код показателя (Y48112027…), {year} — год
  parquet:  "data_{code}_112_v20260928.parquet"                             # весь показатель, 2–9 МБ — читаем его
  csv_year: "data_{code}_parts/data_{code}_year{year}_112_v20260928.csv"   # запасной путь: CSV-часть за год
prefer_parquet: true       # parquet-член в 15–100 раз меньше CSV при том же содержимом (проверено: 2023 — 34 796 строк там и там)
csv:
  sep: ";"
  na_values: ["ND", "UD", ""]   # коды пропусков БДМО → NaN
top_level: "Муниципальное образование верхнего уровня"   # поселения (нижний уровень) и субъекты РФ не берём
population:
  period: "На 1 января"         # основной период; «Значение показателя за год» — только если первого нет
  total: "Все население"
  urban: "Городское население"
  rural: "Сельское население"   # если строки «Городское» нет (сельские районы), городское = всё − сельское
sectors:
  total_label: "Всего по обследуемым видам экономической деятельности"   # точное значение okved2 для «итого»
  period_priority: ["Январь-декабрь", "Январь-сентябрь", "Январь-июнь", "Январь-март"]  # полный год, иначе последнее нарастающим итогом
  full_year: "Январь-декабрь"
  homoglyphs: {"А": "A", "В": "B", "Е": "E", "Н": "H", "С": "C", "К": "K", "М": "M", "О": "O", "Р": "P", "Т": "T", "Х": "X"}  # кириллица в буквах разделов
  other: other
  order: [agriculture, mining, manufacturing, energy_utilities, construction, trade, transport, hospitality,
          ict, finance, realestate_prof, public_admin, education, health, other]
  map:                      # раздел ОКВЭД2 → укрупнённый сектор
    A: agriculture          # сельское, лесное хозяйство, охота, рыболовство
    B: mining               # добыча полезных ископаемых
    C: manufacturing        # обрабатывающие производства
    D: energy_utilities     # электроэнергия, газ, пар
    E: energy_utilities     # водоснабжение, отходы
    F: construction
    G: trade                # торговля, ремонт автотранспорта
    H: transport            # транспортировка и хранение
    I: hospitality          # гостиницы и общепит
    J: ict                  # информация и связь
    K: finance
    L: realestate_prof      # операции с недвижимостью
    M: realestate_prof      # профессиональная, научная, техническая
    N: realestate_prof      # административная деятельность
    O: public_admin         # госуправление, военная безопасность, соцобеспечение
    P: education
    Q: health               # здравоохранение и соцуслуги
    R: other                # культура, спорт, досуг
    S: other                # прочие услуги
    T: other                # домашние хозяйства (в данных нет)
    U: other                # экстерриториальные организации
  # остаток «итого − сумма разделов» (конфиденциальные/отсутствующие разделы) тоже уходит в other, чтобы доли давали 1
derived:
  extractive: [mining, energy_utilities]
  public: [public_admin, education, health]

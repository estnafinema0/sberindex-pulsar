# Итоговая конфигурация типологии — результат сравнения методов (outputs/compare), а не волевое решение.
# Метод: KEFRiN (сбалансированный) — Парето-эффективен (SW как у k-means, сетевые индексы значимо выше: парный бутстрэп,
# ДИ не содержат 0), 4-е место по пороговому правилу Алескерова; лидеры Ward, Leiden, temporal Leiden отклонены по устойчивости или SW, бутстрэп-устойчивость ARI 0.78 при K=6 (Leiden — 0.52),
# единственный из лидеров использует и признаки, и сеть. Подробности — docs/report.md §3.3.
# K: правило (z_AVU + z_SW + устойчивость) даёт 4 макротипа; K=6 — ближайший кандидат с максимальным z_AVU (16.5),
# вложенный в K=4 на 82 % и добавляющий два содержательных типа (Север и ресурсы; мегаполисы). Основной уровень — 6 подтипов,
# макроуровень K=4 показан в отчёте как агрегация.
method: kefrin_balanced
k: 6
k_macro: 4
layer: fused
align: hungarian_jaccard
reference_month: "2023-12"

# Динамика типов МО (src/pulsar/dynamics.py). Цель — отслеживать смены групп во времени без утечки будущего.
seed: 42

min_run: 3                  # смена типа «подтверждена», если новый тип держится ≥ 3 мес. подряд:
                            # отсекает разовые выбросы (праздники, разрывы данных), цена — задержка обнаружения 2 мес.

greene_threshold: 0.3       # порог Жаккара для сопоставления типов соседних месяцев (Greene et al. 2010, θ≈0.3–0.5);
                            # 0.3 позволяет увидеть слияние двух равных типов (J=0.5) и деление на три (J≈0.33)

bootstrap:
  n_boot: 30                # 30 подвыборок: частота голосов с шагом 1/30 ≈ 0.033, на N≈2016 с k-means < 30 с
  frac: 0.8                 # 80 % МО в подвыборке: заметное возмущение, но типы ещё узнаваемы при выравнивании

confidence_threshold: 0.7   # тип МО считается уверенным, если ≥ 70 % бутстрэп-голосов за модальный тип;
                            # вместе с min_run образует правило подтверждения перехода (strategy.md §3 п.6)

train_months: ["2023-01", "2023-12"]   # включительно: на 2023 фиксируются типология и центры типов
test_months: ["2024-01", "2024-12"]    # включительно: 2024 классифицируется онлайн ближайшим центром, без пересчёта

# Параметры конвейера (src/pulsar/run_dynamics.py)
confirm_with_confidence: true   # подтверждение = ≥ min_run мес. И средняя бутстрэп-вероятность назначенного типа
                                # на первых min_run месяцах ≥ confidence_threshold (strategy.md §3 п.6)
bootstrap_n_jobs: -1            # бутстрэп по месяцам параллельно (joblib); −1 — все ядра
bootstrap_skip: [temporal_leiden]   # для temporal Leiden помесячная перекластеризация не воспроизводит метод
                                    # (сквозная модулярность Мухи) — бутстрэп не считаем, подтверждение только по min_run

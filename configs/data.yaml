  extract_to: data/raw            # имена файлов внутри архива в cp866
  files:
    consumption: data/raw/hackathonlicence/consumption.parquet
    market_access: data/raw/hackathonlicence/market_access.parquet
    connection: data/raw/hackathonlicence/connection.parquet
municipal_dict:                   # «Границы и изменения МО», СберИндекс, CC BY-SA 4.0

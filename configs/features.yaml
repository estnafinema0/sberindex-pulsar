# Признаки МО по месяцам. Каждый параметр — с одной фразой «зачем».
panel:
  min_months: 24          # в обучающую панель — только МО с полной историей (24 из 24), чтобы все срезы были сопоставимы
  drop_intracity: false   # внутригородские территории Москвы/СПб оставляем (это МО в данных); абляция — без них
categories: ["Продовольствие", "Здоровье", "Маркетплейсы", "Общественное питание", "Транспорт"]
total: "Все категории"
other_name: "Прочее"      # остаток итога (в медиане 28 %) — чтобы композиция была полной и CLR корректным
composition:
  transform: clr          # CLR долей: композиционные данные → евклидово пространство (Aitchison), сумма компонент = 0
  pseudocount: 1.0e-4     # защита от нулевых долей
level:
  transform: log_rel_median  # log(итог МО / медиана страны в месяце t) — убирает общий сезон и инфляцию, оставляет относительный уровень
  weight: 1.0             # вес уровня относительно композиции; 1.0 — равный вклад после стандартизации
smoothing:
  window: 3               # причинное скользящее среднее t-2..t: гасит шум оценок, не использует будущее
standardize: within_month # z-оценка по МО внутри месяца: признаки сопоставимы между месяцами, сезон не влияет на расстояния
distance:
  kind: highway           # дорожные расстояния между центрами МО как географический слой
  fallback: railway       # для пар без автодороги — ж/д
  zero_distance_km: 5.0   # 148 пар «город — одноимённый район» с общим центром: заменяем 0 на 5 км
  missing_km_factor: 1.3  # пар без обоих расстояний — большой круг × 1.3 (поправка на извилистость дорог)
